<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>Weather App</h1>

        <p class="subtitle">
            Check the current weather of any city
        </p>


        <!-- Search section -->

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">
                Search
            </button>

        </div>


        <!-- Loading message -->

        <p id="loading">
            Loading...
        </p>


        <!-- Error message -->

        <p id="error"></p>


        <!-- Weather information -->

        <div id="weatherCard" class="weather-card">

            <h2 id="city"></h2>

            <p class="forecast" id="forecast"></p>

            <div class="temperature">
                <span id="temperature"></span>°C
            </div>

            <div class="weather-details">

                <div class="detail">
                    <span>Feels Like</span>
                    <strong id="feelsLike"></strong>
                </div>

                <div class="detail">
                    <span>Humidity</span>
                    <strong id="humidity"></strong>
                </div>

                <div class="detail">
                    <span>Wind Speed</span>
                    <strong id="windSpeed"></strong>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
