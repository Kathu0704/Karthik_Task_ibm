# ================================
# Server
# ================================
server.port=8080

# ================================
# Application
# ================================
spring.application.name=banking-app

# ================================
# Datasource (H2 in-memory, for quick local dev/testing)
# Swap this out for MySQL/Postgres when you're ready for a real DB.
# ================================
spring.datasource.url=jdbc:h2:mem:bankingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================
# Redis connection details
# NOTE: Spring Boot 3.x renamed "spring.redis.*" to "spring.data.redis.*"
# (spring.redis.* is silently ignored on Boot 3, so we use the current key)
# ================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Enable Redis as cache provider
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
