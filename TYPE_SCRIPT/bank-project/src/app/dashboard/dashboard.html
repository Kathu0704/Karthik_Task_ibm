<h2>Account Dashboard</h2>


<h3>
Available Balance :
₹ {{balance}}
</h3>



<h3>Recent Transactions</h3>


<table border="1">

<tr>
<th>Date</th>
<th>Description</th>
<th>Amount</th>
</tr>


<tr *ngFor="let t of transactions">

<td>{{t.date}}</td>
<td>{{t.description}}</td>
<td>{{t.amount}}</td>

</tr>


</table>



<h3>Fund Transfer</h3>


<input 
type="number"
placeholder="Enter Amount"
[(ngModel)]="amount">


<button (click)="transfer()">
Transfer
</button>


<p>{{message}}</p>
