<h2>Create Account</h2>


<input 
placeholder="Account Number"
#account>


<br>


<input 
type="password"
placeholder="Password"
#password>


<br>


<input 
type="number"
placeholder="Initial Amount"
#amount>


<br>


<button 
(click)="register(
account.value,
password.value,
amount.value
)">
Register
</button>
